name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
    secrets:
      HCLI_API_KEY: ${{ secrets.HCLI_API_KEY }}
      IDA_LICENSE_ID: ${{ secrets.IDA_LICENSE_ID }}

  release:
    name: Publish the GitHub release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the plugin archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-archive
          path: dist

      - name: Check that the tag matches the plugin version
        run: |
          version="$(unzip -p dist/*.zip ida-plugin.json | jq -r .plugin.version)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match plugin version ${version}"
            exit 1
          fi

      - name: Create the release
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
